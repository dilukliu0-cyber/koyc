name: TestFlight (Gorilla Counter)

on:
  workflow_dispatch:

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gorilla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gorilla/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      # links the app to your Expo account on first run (writes extra.eas.projectId)
      - run: eas init --non-interactive --force
      - run: eas build --platform ios --profile production --non-interactive --auto-submit
